eval_num_inference_steps: 10
model:
  _target_: awomo.awomo.factory.create_imagewam_flux2_klein_actionpatch_vl
  flux2_model_path: null
  ae_model_path: null
  flux2_src_path: null
  variant: klein-base-4b
  vl_model_path: null
  vl_qwen_layers:
  - 9
  - 18
  - 27
  vl_max_prompt_len: 768
  vl_attn_implementation: sdpa
  vl_lora:
    enabled: true
    r: 64
    alpha: 128
    dropout: 0.05
    target_modules: .*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$
  proprio_dim: 14
  pack_proprio_after_text: true
  mot_checkpoint_mixed_attn: true
  mot_gqa_implementation: repeat
  mot_force_flash_attention: false
  action_patch_dim: 14
  action_patch_scale: 1.0
  target_views: null
  view_time_stride: 1.0
  history_max_slots: 20
  history_pool_grid:
  - 4
  - 4
  history_vae_micro_batch: 16
  vl_ar:
    image_size:
    - 448
    - 448
    history_image_size:
    - 448
    - 448
    history_pool:
    - 4
    - 4
    history_num_slots: 20
    history_period_s: 1.0
    history_fps: 25.0
    summary_layers:
    - 18
    - 27
    - 36
    max_new_tokens: 24
    decode_every: 4
  video_scheduler:
    infer_shift: 5.0
    num_train_timesteps: 1000
data:
  train:
    num_frames: 17
    video_size:
    - 256
    - 256
    cameras:
    - cam_head
    - cam_left_wrist
    - cam_right_wrist
    concat_multi_camera: null
    action_dim: 14
    norm_default_mode: z-score
    history:
